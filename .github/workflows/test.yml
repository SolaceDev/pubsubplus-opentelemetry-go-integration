name: Test

# Controls when the workflow will run
on: [push, pull_request, workflow_dispatch]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  Linux:
    # The type of runner that the job will run on. Pinned rather than using
    # ubuntu-latest, which GitHub silently migrates to a new OS version over
    # time. If this image turns out to be problematic, fall back to ubuntu-24.04.
    runs-on: ubuntu-26.04

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go environment
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
          check-latest: true
      
      - name: Compiles
        run: |
          go mod tidy
          go build ./...

      - name: Runs go fmt
        if: ${{ success() }}
        run: |
          OUTPUT=$(go fmt ./... 2>&1)
          if [ ! -z "$OUTPUT" ]; then
            echo "go fmt failed on the following files:"
            echo "$OUTPUT"
            exit 1
          fi
      - name: Runs unit tests
        if: ${{ success() }}
        run: go test -coverprofile ./unitcoverage.out ./...

      - name: Generates the SEMPv2 client
        if: ${{ success() }}
        run: |
          go generate .
        working-directory: ./test/sempclient

      - name: Runs the integration tests
        if: ${{ success() }}
        run: |
          mkdir reports
          go install github.com/onsi/ginkgo/v2/ginkgo@v2.23.4
          ginkgo --junit-report=./reports/report.xml -coverprofile ./reports/coverage.out -coverpkg solace.dev/go/messaging-trace/opentelemetry/internal/...,solace.dev/go/messaging-trace/opentelemetry/... -tags enable_debug_logging
        working-directory: ./test

      - name: Uploads artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          # diagnostics.tgz is only produced when the integration tests gather
          # broker diagnostics, so a missing file must not fail the job.
          if-no-files-found: warn
          path: |
            ./unitcoverage.out
            ./test/reports/report.xml
            ./test/reports/coverage.out
            ./test/diagnostics.tgz
